/* ============================================================
   Deadline Tracker — Apple-Inspired Dark Mode Design System
   Premium glassmorphism UI for pywebview desktop (~1100×750)
   ============================================================ */

/* ----------------------------------------------------------
   CSS Custom Properties
   ---------------------------------------------------------- */
:root {
  /* Backgrounds */
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-card: rgba(255, 255, 255, 0.04);
  --bg-card-hover: rgba(255, 255, 255, 0.06);
  --bg-glass: rgba(255, 255, 255, 0.05);
  --bg-modal: rgba(30, 30, 35, 0.95);
  --bg-input: rgba(255, 255, 255, 0.06);

  /* Accent */
  --accent: #007AFF;
  --accent-light: #5AC8FA;
  --accent-glow: rgba(0, 122, 255, 0.1);
  --accent-subtle: rgba(0, 122, 255, 0.12);
  --accent-hover: rgba(0, 122, 255, 0.2);
  --accent-ring: rgba(0, 122, 255, 0.15);

  /* Urgency */
  --urgent-safe: #34C759;
  --urgent-warning: #FFD60A;
  --urgent-danger: #FF9F0A;
  --urgent-critical: #FF453A;

  /* Success */
  --success: #34C759;
  --success-subtle: rgba(52, 199, 89, 0.12);
  --success-hover: rgba(52, 199, 89, 0.2);
  --success-border: rgba(52, 199, 89, 0.2);

  /* Text */
  --text-primary: #f5f5f7;
  --text-secondary: #86868b;
  --text-tertiary: #48484a;

  /* Borders */
  --border: rgba(255, 255, 255, 0.08);
  --border-light: rgba(255, 255, 255, 0.06);
  --border-input: rgba(255, 255, 255, 0.1);

  /* Typography */
  --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI Variable', 'Segoe UI', sans-serif;
  --font-size-title: 28px;
  --font-size-card-title: 16px;
  --font-size-body: 15px;
  --font-size-label: 13px;
  --font-size-caption: 11px;
  --font-size-badge: 10px;

  /* Spacing */
  --header-height: 56px;
  --content-padding: 24px;
  --card-padding: 20px 22px;
  --card-radius: 16px;
  --modal-radius: 20px;
  --btn-radius: 10px;
  --input-radius: 10px;

  /* Transitions */
  --spring: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --glass-blur: blur(40px) saturate(180%);
}

/* ----------------------------------------------------------
   Reset & Base
   ---------------------------------------------------------- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-family);
  background:
    radial-gradient(circle at 15% -10%, rgba(0, 122, 255, 0.13), transparent 36%),
    radial-gradient(circle at 90% 110%, rgba(94, 92, 230, 0.10), transparent 38%),
    linear-gradient(145deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
  color: var(--text-primary);
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  line-height: 1.5;
  font-size: var(--font-size-body);
}

::selection {
  background: var(--accent);
  color: #fff;
}

/* ----------------------------------------------------------
   Scrollbar
   ---------------------------------------------------------- */
::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 99px;
}

::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.25);
}

/* ----------------------------------------------------------
   App Container
   ---------------------------------------------------------- */
.app-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100%;
}

/* ----------------------------------------------------------
   App Header
   ---------------------------------------------------------- */
.app-header {
  height: var(--header-height);
  min-height: var(--header-height);
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  background: rgba(10, 10, 15, 0.8);
  backdrop-filter: blur(20px) saturate(150%);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
  z-index: 100;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.app-title {
  font-size: var(--font-size-title);
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  user-select: none;
}

.task-count {
  font-size: var(--font-size-caption);
  font-weight: 500;
  color: var(--text-tertiary);
  background: var(--bg-input);
  padding: 2px 10px;
  border-radius: 99px;
  letter-spacing: 0.02em;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ----------------------------------------------------------
   Add Button
   ---------------------------------------------------------- */
.add-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--btn-radius);
  background: var(--accent-subtle);
  color: var(--accent);
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
  user-select: none;
  transition: background 0.2s ease,
              transform 0.3s var(--spring);
  line-height: 1;
}

.add-btn:hover {
  background: var(--accent-hover);
  transform: scale(1.05);
}

.add-btn:active {
  transform: scale(0.92);
}

button:focus-visible,
[contenteditable="true"]:focus-visible,
input:focus-visible {
  outline: 2px solid var(--accent-light);
  outline-offset: 3px;
}

/* ----------------------------------------------------------
   Main Content
   ---------------------------------------------------------- */
.main-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: var(--content-padding);
}

/* ----------------------------------------------------------
   Tasks Grid
   ---------------------------------------------------------- */
.tasks-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}

/* ----------------------------------------------------------
   Task Card
   ---------------------------------------------------------- */
.task-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--card-radius);
  padding: var(--card-padding);
  position: relative;
  border-left: 4px solid var(--border);
  transition: transform 0.3s var(--spring),
              box-shadow 0.3s ease,
              background 0.2s ease,
              opacity 0.3s ease;
  animation: cardAppear 0.4s var(--spring) both;
}

.task-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px var(--accent-glow);
  background: var(--bg-card-hover);
}

.task-card:active {
  transform: scale(0.98);
}

.task-card {
  --urgency-hue: 145;
  border-left-color: hsl(var(--urgency-hue) 82% 52%);
}

/* Finishing animation */
.task-card.finishing {
  animation: finishSlide 0.5s var(--ease-out) forwards;
  pointer-events: none;
}

/* ----------------------------------------------------------
   Card Header
   ---------------------------------------------------------- */
.card-header {
  display: flex;
  flex-direction: row;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}

.task-title {
  font-size: var(--font-size-card-title);
  font-weight: 600;
  color: var(--text-primary);
  background: transparent;
  border: none;
  outline: none;
  border-bottom: 1px solid transparent;
  padding-bottom: 2px;
  transition: border-color 0.2s ease;
  line-height: 1.4;
  flex: 1;
  min-width: 0;
  word-break: break-word;
}

.task-title:focus {
  border-bottom-color: rgba(0, 122, 255, 0.5);
}

.task-title[contenteditable="true"] {
  cursor: text;
}

.card-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.2s ease;
  flex-shrink: 0;
}

.task-card:hover .card-actions {
  opacity: 1;
}

.card-action-btn {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s ease,
              color 0.15s ease,
              transform 0.2s var(--spring);
}

.card-action-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-primary);
}

.card-action-btn:active {
  transform: scale(0.88);
}

.card-action-btn.delete-btn:hover {
  background: rgba(255, 69, 58, 0.12);
  color: var(--urgent-critical);
}

/* ----------------------------------------------------------
   Deadline Row
   ---------------------------------------------------------- */
.deadline-row {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  cursor: pointer;
}

.deadline-icon {
  font-size: 14px;
  color: var(--text-secondary);
  flex-shrink: 0;
}

.deadline-text {
  font-size: var(--font-size-label);
  color: var(--text-secondary);
  transition: color 0.2s ease;
}

.deadline-row:hover .deadline-text {
  color: var(--accent-light);
}

.deadline-input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
  pointer-events: none;
}

input[type="datetime-local"] {
  font-family: var(--font-family);
  color-scheme: dark;
  background: var(--bg-input);
  color: var(--text-primary);
  border: 1px solid var(--border-input);
  border-radius: var(--input-radius);
  padding: 8px 12px;
  font-size: var(--font-size-label);
}

/* ----------------------------------------------------------
   Countdown Display
   ---------------------------------------------------------- */
.countdown-display {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 4px;
  margin-top: 16px;
}

.countdown-segment {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 40px;
}

.countdown-value {
  font-size: 28px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
  color: var(--text-primary);
  transition: color 0.3s ease;
}

.countdown-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-secondary);
  margin-top: 2px;
}

.countdown-separator {
  align-self: center;
  color: var(--text-secondary);
  font-size: 20px;
  font-weight: 300;
  padding-top: 2px;
  user-select: none;
}

.task-card .countdown-value {
  color: hsl(var(--urgency-hue) 82% 60%);
}

/* ----------------------------------------------------------
   Card Footer
   ---------------------------------------------------------- */
.card-footer {
  display: flex;
  flex-direction: row;
  justify-content: space-between;
  align-items: center;
  margin-top: 18px;
}

/* ----------------------------------------------------------
   Urgency Badge
   ---------------------------------------------------------- */
.urgency-badge {
  font-size: var(--font-size-badge);
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 99px;
  letter-spacing: 0.02em;
  user-select: none;
}

.task-card .urgency-badge {
  background: hsl(var(--urgency-hue) 82% 52% / 0.14);
  color: hsl(var(--urgency-hue) 82% 65%);
}

/* ----------------------------------------------------------
   Finish Button
   ---------------------------------------------------------- */
.finish-btn {
  display: flex;
  align-items: center;
  padding: 8px 18px;
  border-radius: var(--btn-radius);
  background: var(--success-subtle);
  color: var(--success);
  font-family: var(--font-family);
  font-weight: 600;
  font-size: var(--font-size-label);
  border: 1px solid var(--success-border);
  cursor: pointer;
  user-select: none;
  transition: background 0.2s ease,
              transform 0.3s var(--spring);
  line-height: 1;
}

.finish-btn:hover {
  background: var(--success-hover);
  transform: scale(1.02);
}

.finish-btn:active {
  transform: scale(0.96);
}

.finish-btn.overdue-notice-btn,
.finish-btn.overdue-noticed {
  background: var(--accent-subtle);
  color: var(--accent-light);
  border-color: var(--accent-ring);
}

.finish-btn.overdue-notice-btn:hover {
  background: var(--accent-hover);
}

/* ----------------------------------------------------------
   Modal Overlay
   ---------------------------------------------------------- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.25s ease, visibility 0s linear 0.35s;
}

.modal-overlay.active {
  opacity: 1;
  visibility: visible;
  pointer-events: all;
  transition-delay: 0s;
}

/* ----------------------------------------------------------
   Modal Content
   ---------------------------------------------------------- */
.modal-content {
  background: var(--bg-modal);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border-input);
  border-radius: var(--modal-radius);
  padding: 28px;
  width: 420px;
  max-width: 90vw;
  transform: scale(0.92) translateY(10px);
  opacity: 0;
  transition: transform 0.35s var(--spring),
              opacity 0.25s ease;
}

.modal-overlay.active .modal-content {
  transform: scale(1) translateY(0);
  opacity: 1;
}

.modal-title {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 20px;
  text-align: center;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}

.modal-subtitle {
  margin: -10px auto 20px;
  max-width: 340px;
  color: var(--text-secondary);
  font-size: 13px;
  line-height: 1.5;
  text-align: center;
}

/* ----------------------------------------------------------
   Form Elements
   ---------------------------------------------------------- */
.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.form-input {
  width: 100%;
  padding: 12px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border-input);
  border-radius: var(--input-radius);
  color: var(--text-primary);
  font-family: var(--font-family);
  font-size: var(--font-size-body);
  transition: border-color 0.2s ease,
              box-shadow 0.2s ease;
}

.form-input:focus {
  border-color: var(--accent);
  outline: none;
  box-shadow: 0 0 0 3px var(--accent-ring);
}

.form-input::placeholder {
  color: var(--text-tertiary);
}

/* ----------------------------------------------------------
   Modal Actions
   ---------------------------------------------------------- */
.modal-actions {
  display: flex;
  flex-direction: row;
  gap: 10px;
  margin-top: 24px;
}

.btn-primary {
  flex: 1;
  padding: 12px;
  border-radius: var(--btn-radius);
  background: var(--accent);
  color: #fff;
  font-family: var(--font-family);
  font-weight: 600;
  font-size: var(--font-size-body);
  border: none;
  cursor: pointer;
  user-select: none;
  transition: filter 0.2s ease,
              transform 0.2s var(--spring);
}

.btn-primary:hover {
  filter: brightness(1.1);
}

.btn-primary:active {
  transform: scale(0.97);
}

.btn-secondary {
  flex: 1;
  padding: 12px;
  border-radius: var(--btn-radius);
  background: var(--bg-input);
  color: var(--text-secondary);
  font-family: var(--font-family);
  font-weight: 500;
  font-size: var(--font-size-body);
  border: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  transition: background 0.2s ease,
              transform 0.2s var(--spring);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.1);
}

.btn-secondary:active {
  transform: scale(0.97);
}

/* ----------------------------------------------------------
   Finished Section
   ---------------------------------------------------------- */
.finished-section {
  margin-top: 32px;
  border-top: 1px solid var(--border-light);
  padding-top: 20px;
}

.finished-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.finished-header {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
  padding: 4px 0;
  border: 0;
  background: transparent;
  font-family: var(--font-family);
}

.finished-header:hover .finished-title {
  color: var(--text-primary);
}

.finished-chevron {
  font-size: 12px;
  color: var(--text-secondary);
  transition: transform 0.3s var(--spring);
  display: flex;
  align-items: center;
  justify-content: center;
}

.finished-header.expanded .finished-chevron {
  transform: rotate(90deg);
}

.finished-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  transition: color 0.2s ease;
}

.finished-count {
  font-size: 12px;
  background: var(--bg-input);
  padding: 2px 8px;
  border-radius: 99px;
  color: var(--text-tertiary);
  font-weight: 500;
}

.finished-list {
  display: grid;
  grid-template-rows: 0fr;
  opacity: 0;
  transition: grid-template-rows 0.35s var(--spring), opacity 0.2s ease;
}

.finished-list.expanded {
  grid-template-rows: 1fr;
  opacity: 1;
}

.finished-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
  padding-top: 16px;
  overflow: hidden;
}

.clear-completed-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 32px;
  padding: 0 10px;
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
  color: var(--text-secondary);
  font-family: var(--font-family);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: color 0.18s ease, background 0.18s ease, transform 0.18s var(--spring);
}

.clear-completed-btn:hover {
  color: var(--urgent-critical);
  background: rgba(255, 69, 58, 0.10);
}

.clear-completed-btn:active {
  transform: scale(0.96);
}

/* ----------------------------------------------------------
   Finished Card
   ---------------------------------------------------------- */
.finished-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--card-radius);
  padding: var(--card-padding);
  position: relative;
  opacity: 0.6;
  border-left: 4px solid var(--border);
  transition: opacity 0.2s ease;
}

.finished-card:hover {
  opacity: 0.75;
}

.finished-card.clearing {
  transform: scale(0.96) translateY(6px);
  opacity: 0;
  transition: transform 0.26s var(--spring), opacity 0.2s ease;
}

/* ----------------------------------------------------------
   Completed Tasks Action Sheet
   ---------------------------------------------------------- */
.action-sheet-overlay {
  align-items: flex-end;
  padding: 20px;
}

.action-sheet {
  width: min(480px, calc(100vw - 32px));
  margin: 0 auto;
  padding: 10px 18px 18px;
  border: 1px solid var(--border-input);
  border-radius: 24px;
  background: rgba(30, 30, 35, 0.88);
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.48);
  backdrop-filter: blur(32px) saturate(180%);
  -webkit-backdrop-filter: blur(32px) saturate(180%);
  transform: translateY(36px) scale(0.97);
  opacity: 0;
  transition: transform 0.35s var(--spring), opacity 0.2s ease;
}

.action-sheet-overlay.active .action-sheet {
  transform: translateY(0) scale(1);
  opacity: 1;
}

.sheet-handle {
  width: 38px;
  height: 4px;
  margin: 0 auto 16px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.18);
}

.clear-options {
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.035);
}

.clear-option {
  width: 100%;
  min-height: 54px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  border: 0;
  border-bottom: 1px solid var(--border-light);
  background: transparent;
  color: var(--text-primary);
  font-family: var(--font-family);
  font-size: 14px;
  text-align: left;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.15s ease;
}

.clear-option:last-child {
  border-bottom: 0;
}

.clear-option:hover:not(:disabled) {
  background: rgba(255, 255, 255, 0.07);
}

.clear-option:active:not(:disabled) {
  transform: scale(0.985);
}

.clear-option:disabled {
  color: var(--text-tertiary);
  cursor: default;
}

.clear-option-danger:not(:disabled) {
  color: var(--urgent-critical);
}

.option-detail {
  color: var(--text-tertiary);
  font-size: 11px;
  white-space: nowrap;
}

.sheet-cancel {
  width: 100%;
  min-height: 44px;
  margin-top: 12px;
  border: 0;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.08);
  color: var(--accent-light);
  font-family: var(--font-family);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.15s var(--spring);
}

.sheet-cancel:hover {
  background: rgba(255, 255, 255, 0.12);
}

.sheet-cancel:active {
  transform: scale(0.98);
}

/* ----------------------------------------------------------
   Native Close Choice
   ---------------------------------------------------------- */
.close-dialog {
  width: 460px;
  text-align: center;
}

.close-dialog-icon {
  width: 52px;
  height: 52px;
  margin: 0 auto 14px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: var(--accent-subtle);
  color: var(--accent-light);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

.close-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.close-choice {
  min-height: 62px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  padding: 10px 14px;
  text-align: left;
}

.close-choice small {
  margin-top: 2px;
  color: var(--text-tertiary);
  font-size: 11px;
  font-weight: 500;
}

.btn-danger {
  border: 1px solid rgba(255, 69, 58, 0.16);
  border-radius: var(--btn-radius);
  background: rgba(255, 69, 58, 0.12);
  color: var(--urgent-critical);
  font-family: var(--font-family);
  font-size: var(--font-size-body);
  font-weight: 600;
  cursor: pointer;
  transition: background 0.18s ease, transform 0.18s var(--spring);
}

.btn-danger:hover {
  background: rgba(255, 69, 58, 0.18);
}

.btn-danger:active {
  transform: scale(0.97);
}

.close-error {
  min-height: 17px;
  margin-top: 12px;
  color: var(--urgent-critical);
  font-size: 11px;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 1100;
  min-height: 46px;
  padding: 8px 10px 8px 16px;
  display: flex;
  align-items: center;
  gap: 18px;
  border: 1px solid var(--border-input);
  border-radius: 14px;
  background: rgba(40, 40, 46, 0.90);
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.42);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  color: var(--text-primary);
  font-size: 13px;
  transform: translate(-50%, 18px) scale(0.97);
  opacity: 0;
  pointer-events: none;
  transition: transform 0.3s var(--spring), opacity 0.2s ease;
}

.toast.visible {
  transform: translate(-50%, 0) scale(1);
  opacity: 1;
  pointer-events: auto;
}

.toast button {
  min-height: 30px;
  padding: 0 10px;
  border: 0;
  border-radius: 8px;
  background: var(--accent-subtle);
  color: var(--accent-light);
  font-family: var(--font-family);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.finished-card .countdown-display {
  display: none;
}

.finished-card .completed-label {
  margin-top: 16px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--font-size-label);
  color: var(--urgent-safe);
  font-weight: 500;
}

.completed-check {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--success-subtle);
  color: var(--success);
  font-size: 11px;
  flex-shrink: 0;
}

.finished-card .card-footer {
  display: none;
}

.finished-card .card-actions {
  opacity: 0;
}

.finished-card:hover .card-actions {
  opacity: 1;
}

/* ----------------------------------------------------------
   Countdown Overdue
   ---------------------------------------------------------- */
.countdown-overdue {
  display: flex;
  align-items: center;
  font-size: calc(var(--font-size-label) * 1.5);
  font-weight: 600;
  color: #d6362f;
  margin-top: 16px;
}

.countdown-overdue svg {
  width: 24px;
  height: 24px;
  margin-right: 9px !important;
}

/* ----------------------------------------------------------
   Finished Task Title
   ---------------------------------------------------------- */
.finished-task-title {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}

.finished-task-title span {
  font-size: var(--font-size-card-title);
  font-weight: 500;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ----------------------------------------------------------
   Finished Meta
   ---------------------------------------------------------- */
.finished-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
}

.finished-badge {
  font-size: var(--font-size-badge);
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 99px;
  background: rgba(52, 199, 89, 0.15);
  color: var(--urgent-safe);
  letter-spacing: 0.02em;
  user-select: none;
}

.finished-badge-overdue {
  background: rgba(214, 54, 47, 0.16);
  color: #d6362f;
}

.finished-date {
  font-size: var(--font-size-caption);
  color: var(--text-tertiary);
}

/* ----------------------------------------------------------
   Input Error Animation
   ---------------------------------------------------------- */
.form-input.input-error {
  border-color: var(--urgent-critical);
  animation: inputShake 0.4s ease;
}

@keyframes inputShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

/* ----------------------------------------------------------
   Finish Button Disabled
   ---------------------------------------------------------- */
.finish-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
}

.finish-btn:disabled:hover {
  background: var(--success-subtle);
  transform: none;
}

.finish-btn.overdue-notice-btn:disabled,
.finish-btn.overdue-noticed:disabled {
  opacity: 1;
  background: var(--accent-subtle);
  color: var(--accent-light);
  border-color: var(--accent-ring);
}

.finish-btn.overdue-notice-btn:disabled:hover,
.finish-btn.overdue-noticed:disabled:hover {
  background: var(--accent-subtle);
}

/* ----------------------------------------------------------
   Empty State
   ---------------------------------------------------------- */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 300px;
  gap: 12px;
  user-select: none;
}

.empty-state-icon {
  font-size: 64px;
  line-height: 1;
  margin-bottom: 4px;
}

.empty-state-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
}

.empty-state-subtitle {
  font-size: 14px;
  color: var(--text-secondary);
  text-align: center;
  max-width: 300px;
  line-height: 1.5;
}

/* ----------------------------------------------------------
   Fireworks Overlay
   ---------------------------------------------------------- */
.fireworks-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  pointer-events: none;
}

.fireworks-overlay canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.congrats-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.5);
  font-size: 48px;
  font-weight: 700;
  color: #fff;
  text-shadow:
    0 0 20px rgba(255, 215, 0, 0.6),
    0 0 40px rgba(255, 215, 0, 0.3),
    0 0 80px rgba(255, 215, 0, 0.15);
  opacity: 0;
  pointer-events: none;
  user-select: none;
  white-space: nowrap;
  animation: congratsIn 3s var(--spring) forwards;
  animation-delay: 0.3s;
}

/* ----------------------------------------------------------
   Keyframe Animations
   ---------------------------------------------------------- */
@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes slideUp {
  from {
    transform: translateY(20px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

@keyframes pulse {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.02);
  }
}

@keyframes cardAppear {
  from {
    transform: scale(0.9);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

@keyframes congratsIn {
  0% {
    transform: translate(-50%, -50%) scale(0.5);
    opacity: 0;
  }
  15% {
    transform: translate(-50%, -50%) scale(1.08);
    opacity: 1;
  }
  25% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
  65% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
  100% {
    transform: translate(-50%, -50%) scale(1.05);
    opacity: 0;
  }
}

@keyframes finishSlide {
  0% {
    transform: scale(1);
    opacity: 1;
    max-height: 300px;
    margin-bottom: 0;
    padding: 20px 22px;
  }
  40% {
    transform: scale(0.95);
    opacity: 0.5;
  }
  100% {
    transform: scale(0.9) translateY(10px);
    opacity: 0;
    max-height: 0;
    margin-bottom: -16px;
    padding: 0 22px;
    border-width: 0;
  }
}

@keyframes chevronRotate {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(90deg);
  }
}

/* ----------------------------------------------------------
   Card stagger animation delays
   ---------------------------------------------------------- */
.task-card:nth-child(1) { animation-delay: 0.00s; }
.task-card:nth-child(2) { animation-delay: 0.04s; }
.task-card:nth-child(3) { animation-delay: 0.08s; }
.task-card:nth-child(4) { animation-delay: 0.12s; }
.task-card:nth-child(5) { animation-delay: 0.16s; }
.task-card:nth-child(6) { animation-delay: 0.20s; }
.task-card:nth-child(7) { animation-delay: 0.24s; }
.task-card:nth-child(8) { animation-delay: 0.28s; }
.task-card:nth-child(9) { animation-delay: 0.32s; }
.task-card:nth-child(10) { animation-delay: 0.36s; }
.task-card:nth-child(11) { animation-delay: 0.40s; }
.task-card:nth-child(12) { animation-delay: 0.44s; }

/* ----------------------------------------------------------
   Responsive
   ---------------------------------------------------------- */
@media (max-width: 720px) {
  .tasks-grid,
  .finished-grid {
    grid-template-columns: 1fr;
  }

  .app-title {
    font-size: 22px;
  }

  .main-content {
    padding: 16px;
  }

  .modal-content {
    padding: 22px;
    width: calc(100vw - 32px);
  }

  .congrats-text {
    font-size: 36px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

@media (prefers-reduced-transparency: reduce) {
  .app-header,
  .modal-content,
  .action-sheet,
  .toast {
    background: #1c1c22;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
}

@media (prefers-contrast: more) {
  .task-card,
  .finished-card,
  .modal-content,
  .action-sheet {
    border-color: rgba(255, 255, 255, 0.34);
  }
}

@media (max-width: 480px) {
  .app-header {
    padding: 0 16px;
  }

  .countdown-value {
    font-size: 22px;
  }

  .countdown-segment {
    min-width: 32px;
  }

  .close-actions {
    grid-template-columns: 1fr;
  }
}

</style>
</head>

    <div class="modal-overlay action-sheet-overlay" id="clearOverlay" aria-hidden="true">

    <script>
/* ============================================================
   Fireworks & Confetti Celebration Module
   Standalone canvas-based particle animation system
   ============================================================ */

(function () {
  'use strict';

  var COLORS = [
    '#FFD700', // Gold
    '#FF453A', // Red
    '#007AFF', // Blue
    '#34C759', // Green
    '#FF2D55', // Magenta
    '#5AC8FA', // Cyan
  ];

  var TOTAL_DURATION = 3000;
  var BURST_COUNT_MIN = 5;
  var BURST_COUNT_MAX = 8;
  var BURST_STAGGER_WINDOW = 1500;
  var PARTICLES_PER_BURST_MIN = 40;
  var PARTICLES_PER_BURST_MAX = 80;
  var CONFETTI_COUNT_MIN = 30;
  var CONFETTI_COUNT_MAX = 50;
  var GRAVITY = 0.15;
  var AIR_RESISTANCE = 0.98;
  var PARTICLE_FADE_MIN = 1.5;
  var PARTICLE_FADE_MAX = 2.5;
  var CONFETTI_FADE_DURATION = 3.0;

  function randomRange(min, max) {
    return Math.random() * (max - min) + min;
  }

  function randomInt(min, max) {
    return Math.floor(randomRange(min, max + 1));
  }

  function pickColor() {
    return COLORS[Math.floor(Math.random() * COLORS.length)];
  }

  function hexToRgb(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result
      ? {
          r: parseInt(result[1], 16),
          g: parseInt(result[2], 16),
          b: parseInt(result[3], 16),
        }
      : { r: 255, g: 255, b: 255 };
  }

  /* ----------------------------------------------------------
     Particle class
     ---------------------------------------------------------- */
  function Particle(x, y, color) {
    var angle = Math.random() * Math.PI * 2;
    var speed = randomRange(2, 10);

    this.x = x;
    this.y = y;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed - randomRange(1, 3);
    this.color = hexToRgb(color);
    this.alpha = 1;
    this.fadeRate = 1 / (randomRange(PARTICLE_FADE_MIN, PARTICLE_FADE_MAX) * 60);
    this.size = randomRange(2, 5);
    this.isStreak = Math.random() < 0.3;
    this.streakLength = randomRange(4, 10);
    this.alive = true;
  }

  Particle.prototype.update = function () {
    this.vy += GRAVITY;
    this.vx *= AIR_RESISTANCE;
    this.vy *= AIR_RESISTANCE;
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= this.fadeRate;
    if (this.alpha <= 0) {
      this.alpha = 0;
      this.alive = false;
    }
  };

  Particle.prototype.draw = function (ctx) {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    var r = this.color.r;
    var g = this.color.g;
    var b = this.color.b;

    if (this.isStreak) {
      var prevX = this.x - this.vx * this.streakLength * 0.3;
      var prevY = this.y - this.vy * this.streakLength * 0.3;
      ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + this.alpha + ')';
      ctx.lineWidth = this.size * 0.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(prevX, prevY);
      ctx.lineTo(this.x, this.y);
      ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + this.alpha + ')';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  };

  /* ----------------------------------------------------------
     Confetti class
     ---------------------------------------------------------- */
  function Confetti(canvasWidth, canvasHeight) {
    this.x = randomRange(canvasWidth * 0.1, canvasWidth * 0.9);
    this.y = randomRange(-50, canvasHeight * 0.3);
    this.width = randomRange(6, 12);
    this.height = randomRange(4, 8);
    this.color = hexToRgb(pickColor());
    this.alpha = 1;
    this.fadeRate = 1 / (CONFETTI_FADE_DURATION * 60);
    this.vy = randomRange(1.5, 3.5);
    this.vx = randomRange(-0.8, 0.8);
    this.swayAmplitude = randomRange(0.5, 2);
    this.swayFrequency = randomRange(0.02, 0.05);
    this.rotation = Math.random() * Math.PI * 2;
    this.rotationSpeed = randomRange(-0.08, 0.08);
    this.scaleX = 1;
    this.wobbleSpeed = randomRange(0.03, 0.08);
    this.tick = Math.random() * 100;
    this.alive = true;
  }

  Confetti.prototype.update = function () {
    this.tick++;
    this.x += this.vx + Math.sin(this.tick * this.swayFrequency) * this.swayAmplitude;
    this.y += this.vy;
    this.rotation += this.rotationSpeed;
    this.scaleX = Math.cos(this.tick * this.wobbleSpeed);
    this.alpha -= this.fadeRate;
    if (this.alpha <= 0) {
      this.alpha = 0;
      this.alive = false;
    }
  };

  Confetti.prototype.draw = function (ctx) {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.scale(this.scaleX, 1);

    var r = this.color.r;
    var g = this.color.g;
    var b = this.color.b;
    ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + this.alpha + ')';
    ctx.fillRect(-this.width * 0.5, -this.height * 0.5, this.width, this.height);

    ctx.restore();
  };

  /* ----------------------------------------------------------
     Main celebration function
     ---------------------------------------------------------- */
  window.showCelebration = function (onComplete) {
    var dpr = window.devicePixelRatio || 1;
    var width = window.innerWidth;
    var height = window.innerHeight;

    /* --- Create overlay container --- */
    var overlay = document.createElement('div');
    overlay.style.cssText =
      'position:fixed;inset:0;z-index:9999;pointer-events:none;';

    /* --- Create canvas --- */
    var canvas = document.createElement('canvas');
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.cssText = 'width:100%;height:100%;display:block;';
    overlay.appendChild(canvas);

    var ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    /* --- Create congrats text --- */
    var congratsEl = document.createElement('div');
    congratsEl.textContent = '🎉 Congrats!';
    congratsEl.style.cssText = [
      'position:absolute',
      'top:50%',
      'left:50%',
      'transform:translate(-50%,-50%) scale(0.5)',
      'font-size:52px',
      'font-weight:700',
      'color:#fff',
      'font-family:-apple-system,Inter,sans-serif',
      'text-shadow:0 0 20px rgba(255,215,0,0.6),0 0 40px rgba(255,215,0,0.3),0 0 80px rgba(255,215,0,0.15)',
      'opacity:0',
      'pointer-events:none',
      'user-select:none',
      'white-space:nowrap',
      'z-index:10000',
    ].join(';');
    overlay.appendChild(congratsEl);

    document.body.appendChild(overlay);

    /* --- Particle systems --- */
    var particles = [];
    var confetti = [];

    /* --- Schedule firework bursts --- */
    var burstCount = randomInt(BURST_COUNT_MIN, BURST_COUNT_MAX);
    for (var b = 0; b < burstCount; b++) {
      (function (index) {
        var delay = (index / burstCount) * BURST_STAGGER_WINDOW;
        setTimeout(function () {
          spawnBurst();
        }, delay);
      })(b);
    }

    function spawnBurst() {
      var bx = randomRange(width * 0.2, width * 0.8);
      var by = randomRange(height * 0.15, height * 0.45);
      var count = randomInt(PARTICLES_PER_BURST_MIN, PARTICLES_PER_BURST_MAX);
      for (var i = 0; i < count; i++) {
        particles.push(new Particle(bx, by, pickColor()));
      }
    }

    /* --- Spawn confetti --- */
    var confettiCount = randomInt(CONFETTI_COUNT_MIN, CONFETTI_COUNT_MAX);
    for (var c = 0; c < confettiCount; c++) {
      confetti.push(new Confetti(width, height));
    }

    /* --- Animate congrats text with spring effect --- */
    var textStartTime = null;
    var TEXT_APPEAR_DELAY = 300;
    var TEXT_SPRING_DURATION = 500;
    var TEXT_VISIBLE_DURATION = 1700;
    var TEXT_FADE_DURATION = 500;

    function updateCongratsText(elapsed) {
      var textElapsed = elapsed - TEXT_APPEAR_DELAY;
      if (textElapsed < 0) {
        congratsEl.style.opacity = '0';
        congratsEl.style.transform = 'translate(-50%,-50%) scale(0.5)';
        return;
      }

      if (textElapsed < TEXT_SPRING_DURATION) {
        var t = textElapsed / TEXT_SPRING_DURATION;
        var springT = 1 - Math.pow(1 - t, 3);
        var overshoot = 1 + 0.15 * Math.sin(t * Math.PI);
        var scale = 0.5 + (overshoot - 0.5) * springT;
        var opacity = Math.min(1, t * 2);
        congratsEl.style.opacity = String(opacity);
        congratsEl.style.transform =
          'translate(-50%,-50%) scale(' + scale.toFixed(3) + ')';
      } else if (textElapsed < TEXT_SPRING_DURATION + TEXT_VISIBLE_DURATION) {
        congratsEl.style.opacity = '1';
        congratsEl.style.transform = 'translate(-50%,-50%) scale(1)';
      } else {
        var fadeElapsed =
          textElapsed - TEXT_SPRING_DURATION - TEXT_VISIBLE_DURATION;
        var fadeT = Math.min(1, fadeElapsed / TEXT_FADE_DURATION);
        var opacity2 = 1 - fadeT;
        var scaleFade = 1 + fadeT * 0.05;
        congratsEl.style.opacity = String(Math.max(0, opacity2));
        congratsEl.style.transform =
          'translate(-50%,-50%) scale(' + scaleFade.toFixed(3) + ')';
      }
    }

    /* --- Animation loop --- */
    var startTime = performance.now();
    var animationId = null;
    var finished = false;

    function animate(now) {
      if (finished) return;

      var elapsed = now - startTime;
      ctx.clearRect(0, 0, width, height);

      /* Update and draw particles */
      for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.update();
        if (p.alive) {
          p.draw(ctx);
        } else {
          particles.splice(i, 1);
        }
      }

      /* Update and draw confetti */
      for (var j = confetti.length - 1; j >= 0; j--) {
        var cf = confetti[j];
        cf.update();
        if (cf.alive) {
          cf.draw(ctx);
        } else {
          confetti.splice(j, 1);
        }
      }

      /* Update congrats text */
      updateCongratsText(elapsed);

      /* Check completion */
      if (elapsed >= TOTAL_DURATION && particles.length === 0 && confetti.length === 0) {
        cleanup();
        return;
      }

      /* Force cleanup after generous timeout */
      if (elapsed >= TOTAL_DURATION + 1500) {
        cleanup();
        return;
      }

      animationId = requestAnimationFrame(animate);
    }

    function cleanup() {
      if (finished) return;
      finished = true;

      if (animationId) {
        cancelAnimationFrame(animationId);
      }

      /* Fade out overlay gracefully */
      overlay.style.transition = 'opacity 0.3s ease';
      overlay.style.opacity = '0';

      setTimeout(function () {
        if (overlay.parentNode) {
          overlay.parentNode.removeChild(overlay);
        }
        if (typeof onComplete === 'function') {
          onComplete();
        }
      }, 350);
    }

    /* --- Start --- */
    animationId = requestAnimationFrame(animate);
  };
})();

    <script>
/**

 */

(function () {
    'use strict';

    // ─── State ───────────────────────────────────────────────────────────
    let tasks = [];
    let countdownTimer = null;
    let editingTaskId = null; // null = adding new, string = editing existing

    // ─── DOM References ──────────────────────────────────────────────────
    const tasksGrid = document.getElementById('tasksGrid');
    const emptyState = document.getElementById('emptyState');
    const finishedSection = document.getElementById('finishedSection');
    const finishedList = document.getElementById('finishedList');
    const finishedGrid = document.getElementById('finishedGrid');
    const finishedCount = document.getElementById('finishedCount');
    const finishedHeader = document.getElementById('finishedHeader');
    const clearCompletedBtn = document.getElementById('clearCompletedBtn');
    const clearOverlay = document.getElementById('clearOverlay');
    const clearCancel = document.getElementById('clearCancel');
    const closeOverlay = document.getElementById('closeOverlay');

    const closeError = document.getElementById('closeError');
    const undoToast = document.getElementById('undoToast');

    const undoClearBtn = document.getElementById('undoClearBtn');
    const taskCountEl = document.getElementById('taskCount');
    const addBtn = document.getElementById('addBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalContent = document.getElementById('modalContent');
    const modalTitle = document.getElementById('modalTitle');
    const projectTitleInput = document.getElementById('projectTitle');
    const projectDeadlineInput = document.getElementById('projectDeadline');
    const modalCancel = document.getElementById('modalCancel');
    const modalSave = document.getElementById('modalSave');
    let lastClearedTasks = [];
    let toastTimer = null;

    // ─── Utilities ───────────────────────────────────────────────────────

    function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
    }

    function loadTasks() {
        try {
            const data = localStorage.getItem(STORAGE_KEY);
            tasks = data ? JSON.parse(data) : [];
        } catch (e) {
            console.error('Failed to load tasks:', e);
            tasks = [];
        }
    }

    function saveTasks() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (e) {
            console.error('Failed to save tasks:', e);
        }
    }

    function getClearCutoff(range) {
        const cutoff = new Date();
        if (range === 'week') {
            cutoff.setDate(cutoff.getDate() - 7);
            return cutoff.getTime();
        }
        if (range === 'month') {
            cutoff.setMonth(cutoff.getMonth() - 1);
            return cutoff.getTime();
        }
        if (range === 'all') return Number.POSITIVE_INFINITY;
        throw new Error(`Unsupported clear range: ${range}`);
    }

    function getCompletedTasksForRange(range) {
        const cutoff = getClearCutoff(range);
        return getFinishedTasks().filter(task => {
            if (range === 'all') return true;
            const finishedTime = new Date(task.finishedAt).getTime();
            return Number.isFinite(finishedTime) && finishedTime <= cutoff;
        });
    }

    function getActiveTasks() {
        return tasks.filter(t => t.status === 'active');
    }

    function getFinishedTasks() {
        return tasks.filter(t => t.status === 'finished').sort((a, b) => {
            return new Date(b.finishedAt) - new Date(a.finishedAt);
        });
    }

    /**
     * Compute the time remaining until a deadline.
     * Returns { days, hours, minutes, seconds, totalMs, overdue }
     */
    function getTimeRemaining(deadline) {
        const now = Date.now();
        const target = new Date(deadline).getTime();
        const diff = target - now;

        if (diff <= 0) {
            return { days: 0, hours: 0, minutes: 0, seconds: 0, totalMs: diff, overdue: true };
        }

        const totalSeconds = Math.floor(diff / 1000);
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        return { days, hours, minutes, seconds, totalMs: diff, overdue: false };
    }

    /**
     * Determine urgency level based on time remaining.
     */
    function getUrgencyLevel(deadline) {
        const { totalMs, overdue } = getTimeRemaining(deadline);
        if (overdue) return 'critical';
        const hoursLeft = totalMs / (1000 * 60 * 60);
        if (hoursLeft < 24) return 'critical';
        if (hoursLeft < 72) return 'danger';
        if (hoursLeft < 168) return 'warning'; // 7 days
        return 'safe';
    }

    function getUrgencyLabel(level) {
        switch (level) {
            case 'safe': return 'On Track';
            case 'warning': return 'Upcoming';
            case 'danger': return 'Urgent';
            case 'critical': return 'Critical';
            default: return '';
        }
    }

    function getUrgencyHue(deadline) {
        const daysLeft = (new Date(deadline).getTime() - Date.now()) / 86400000;
        if (daysLeft >= 7) return 145;
        if (daysLeft <= 1) return 4;
        return 4 + (daysLeft - 1) / 6 * 141;
    }

    function setUrgencyColor(card, deadline) {
        card.style.setProperty('--urgency-hue', getUrgencyHue(deadline).toFixed(2));
    }

    function formatDeadlineDisplay(isoString) {
        const d = new Date(isoString);
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const month = months[d.getMonth()];
        const day = d.getDate();
        const year = d.getFullYear();
        const hour = d.getHours().toString().padStart(2, '0');
        const min = d.getMinutes().toString().padStart(2, '0');
        return `${month} ${day}, ${year}  ${hour}:${min}`;
    }

    function formatDatetimeLocalValue(isoString) {
        const d = new Date(isoString);
        const y = d.getFullYear();
        const m = (d.getMonth() + 1).toString().padStart(2, '0');
        const day = d.getDate().toString().padStart(2, '0');
        const hr = d.getHours().toString().padStart(2, '0');
        const min = d.getMinutes().toString().padStart(2, '0');
        return `${y}-${m}-${day}T${hr}:${min}`;
    }

    function padZero(n) {
        return n.toString().padStart(2, '0');
    }

    // ─── Rendering ───────────────────────────────────────────────────────

    function render() {
        const active = getActiveTasks();
        const finished = getFinishedTasks();

        // Update task count
        taskCountEl.textContent = `${active.length} active`;

        // Empty state
        if (active.length === 0) {
            emptyState.style.display = 'flex';
            tasksGrid.style.display = 'none';
        } else {
            emptyState.style.display = 'none';
            tasksGrid.style.display = 'grid';
        }

        // Render active tasks
        renderActiveTasks(active);

        // Render finished section
        if (finished.length > 0) {
            finishedSection.style.display = 'block';
            finishedCount.textContent = finished.length;
            renderFinishedTasks(finished);
        } else {
            finishedSection.style.display = 'none';
        }

        // Start countdown updates
        startCountdown();
    }

    function renderActiveTasks(active) {
        // Preserve existing cards where possible for smooth animations
        const existingIds = new Set();
        tasksGrid.querySelectorAll('.task-card').forEach(card => {
            existingIds.add(card.dataset.id);
        });

        const activeIds = new Set(active.map(t => t.id));

        // Remove cards that no longer exist
        tasksGrid.querySelectorAll('.task-card').forEach(card => {
            if (!activeIds.has(card.dataset.id)) {
                card.remove();
            }
        });

        // Add or update cards
        active.forEach((task, index) => {
            let card = tasksGrid.querySelector(`.task-card[data-id="${task.id}"]`);
            if (card) {

    function renderFinishButton(overdue, taskId) {

                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="margin-right: 6px;">
                    <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M8 5v3.5M8 10.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                Overdue
            </div>
        `;
    }

    function renderFinishedTasks(finished) {
        finishedGrid.innerHTML = '';
        finished.forEach(task => {
            const card = document.createElement('div');
            card.className = 'finished-card';
            card.dataset.id = task.id;

            const finishedDate = task.finishedAt ? formatDeadlineDisplay(task.finishedAt) : 'Unknown';
            const wasOverdue = task.completionType === 'overdue';
            const statusIcon = wasOverdue ? '' : `
                <svg class="check-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <circle cx="8" cy="8" r="7" fill="rgba(52,199,89,0.15)" stroke="#34C759" stroke-width="1.2"/>
                    <path d="M5 8l2 2 4-4" stroke="#34C759" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            `;
            const statusBadge = wasOverdue
                ? '<span class="finished-badge finished-badge-overdue">Overdue</span>'
                : '<span class="finished-badge">✓ Finished</span>';

            card.innerHTML = `
                <div class="card-header">
                    <div class="finished-task-title">
                        ${statusIcon}
                        <span>${escapeHtml(task.title)}</span>
                    </div>
                    <div class="card-actions">
                        <button class="card-action-btn delete-btn" title="Remove" data-task-id="${task.id}">
                            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                                <path d="M2.5 4h9M5 4V2.5h4V4M5.5 6.5v4M8.5 6.5v4M3.5 4l.5 8h6l.5-8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="finished-meta">
                    ${statusBadge}
                    <span class="finished-date">Completed ${finishedDate}</span>
                </div>
            `;

            // Delete from finished
            card.querySelector('.delete-btn').addEventListener('click', () => {
                deleteTask(task.id);
            });

            finishedGrid.appendChild(card);
        });
    }

    // ─── Countdown Timer ─────────────────────────────────────────────────

    function startCountdown() {
        if (countdownTimer) clearInterval(countdownTimer);
        countdownTimer = setInterval(() => {
            const active = getActiveTasks();
            active.forEach(task => {
                const card = tasksGrid.querySelector(`.task-card[data-id="${task.id}"]`);
                if (card) {
                    updateCardContent(card, task);
                }
            });
        }, COUNTDOWN_INTERVAL);
    }

    // ─── Modal ───────────────────────────────────────────────────────────

    function openAddModal() {
        editingTaskId = null;
        modalTitle.textContent = 'New Project';
        projectTitleInput.value = '';

        // Default deadline: 7 days from now
        const defaultDeadline = new Date();
        defaultDeadline.setDate(defaultDeadline.getDate() + 7);
        projectDeadlineInput.value = formatDatetimeLocalValue(defaultDeadline.toISOString());

        modalSave.textContent = 'Add Project';
        showModal();
    }

    function openEditModal(taskId) {
        const task = tasks.find(t => t.id === taskId);
        if (!task) return;

        editingTaskId = taskId;
        modalTitle.textContent = 'Edit Project';
        projectTitleInput.value = task.title;
        projectDeadlineInput.value = formatDatetimeLocalValue(task.deadline);
        modalSave.textContent = 'Save Changes';
        showModal();
    }

    function showModal() {
        modalOverlay.classList.add('active');
        modalOverlay.setAttribute('aria-hidden', 'false');
        requestAnimationFrame(() => {
            projectTitleInput.focus();
        });
    }

    function hideModal() {
        modalOverlay.classList.remove('active');
        modalOverlay.setAttribute('aria-hidden', 'true');
        editingTaskId = null;
    }

    function handleModalSave() {
        const title = projectTitleInput.value.trim();
        const deadline = projectDeadlineInput.value;

        if (!title) {
            projectTitleInput.classList.add('input-error');
            projectTitleInput.focus();
            setTimeout(() => projectTitleInput.classList.remove('input-error'), 600);
            return;
        }
        if (!deadline) {
            projectDeadlineInput.classList.add('input-error');
            projectDeadlineInput.focus();
            setTimeout(() => projectDeadlineInput.classList.remove('input-error'), 600);
            return;
        }

        if (editingTaskId) {
            // Edit existing
            const task = tasks.find(t => t.id === editingTaskId);
            if (task) {
                task.title = title;
                task.deadline = new Date(deadline).toISOString();
            }
        } else {
            // Add new
            tasks.push({
                id: generateId(),
                title: title,
                deadline: new Date(deadline).toISOString(),
                createdAt: new Date().toISOString(),
                finishedAt: null,
                status: 'active',
            });
        }

        saveTasks();
        hideModal();
        render();
    }

    // ─── Task Actions ────────────────────────────────────────────────────

    function deleteTask(taskId) {
        const card = tasksGrid.querySelector(`.task-card[data-id="${taskId}"]`)
            || finishedGrid.querySelector(`.finished-card[data-id="${taskId}"]`);

        if (card) {
            card.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
            card.style.transform = 'scale(0.9)';
            card.style.opacity = '0';
            setTimeout(() => {
                tasks = tasks.filter(t => t.id !== taskId);
                saveTasks();
                render();
            }, 300);
        } else {
            tasks = tasks.filter(t => t.id !== taskId);
            saveTasks();
            render();
        }
    }

    function finishTask(taskId, card) {
        const task = tasks.find(t => t.id === taskId);
        if (!task) return;

        // Disable the finish button to prevent double-clicks
        const finishBtn = card.querySelector('.finish-btn');
        if (finishBtn && finishBtn.disabled) return;
        if (finishBtn) finishBtn.disabled = true;

        const wasOverdue = getTimeRemaining(task.deadline).overdue;

        if (wasOverdue) {
            // Overdue tasks stay visible long enough to acknowledge the action,
            // then move to Completed without the full-screen celebration.
            task.status = 'finished';
            task.finishedAt = new Date().toISOString();
            task.completionType = 'overdue';
            saveTasks();

            if (finishBtn) {
                updateFinishButton(finishBtn, true);
                finishBtn.classList.add('overdue-noticed');
                finishBtn.textContent = 'Add Oil💪';
            }

            setTimeout(() => {
                card.classList.add('finishing');
                setTimeout(() => render(), 500);
            }, 750);
            return;
        }

        // Persist the completed state before the celebration so an immediate
        // app close cannot lose the user's action.
        task.status = 'finished';
        task.finishedAt = new Date().toISOString();
        task.completionType = 'finished';
        saveTasks();

        // Trigger fireworks celebration
        window.showCelebration(() => {
            // After celebration, animate the card out
            card.classList.add('finishing');

            setTimeout(() => {
                render();
            }, 500);
        });
    }

    // ─── Finished Section Toggle ─────────────────────────────────────────

    let finishedExpanded = false;

    function toggleFinished() {
        finishedExpanded = !finishedExpanded;
        const list = document.getElementById('finishedList');
        const header = document.getElementById('finishedHeader');

        if (finishedExpanded) {
            list.classList.add('expanded');
            header.classList.add('expanded');
            header.setAttribute('aria-expanded', 'true');
        } else {
            list.classList.remove('expanded');
            header.classList.remove('expanded');
            header.setAttribute('aria-expanded', 'false');
        }
    }

    // ─── Completed Task Clearing ─────────────────────────────────────────

    function updateClearCounts() {
        ['week', 'month', 'all'].forEach(range => {
            const count = getCompletedTasksForRange(range).length;
            const countEl = clearOverlay.querySelector(`[data-clear-count="${range}"]`);
            const option = clearOverlay.querySelector(`[data-clear-range="${range}"]`);
            countEl.textContent = `${count} ${count === 1 ? 'task' : 'tasks'}`;
            option.disabled = count === 0;
        });
    }

    function showClearSheet() {
        updateClearCounts();
        clearOverlay.classList.add('active');
        clearOverlay.setAttribute('aria-hidden', 'false');
        requestAnimationFrame(() => {
            const firstEnabled = clearOverlay.querySelector('.clear-option:not(:disabled)');
            (firstEnabled || clearCancel).focus();
        });
    }

    function hideClearSheet() {
        clearOverlay.classList.remove('active');
        clearOverlay.setAttribute('aria-hidden', 'true');
        clearCompletedBtn.focus();
    }

    function clearCompletedTasks(range) {
        const toClear = getCompletedTasksForRange(range);
        if (toClear.length === 0) return;

        const clearedIds = new Set(toClear.map(task => task.id));
        lastClearedTasks = toClear;
        tasks = tasks.filter(task => !clearedIds.has(task.id));
        saveTasks();
        hideClearSheet();

        finishedGrid.querySelectorAll('.finished-card').forEach(card => {
            if (clearedIds.has(card.dataset.id)) card.classList.add('clearing');
        });

        window.setTimeout(() => {
            render();
            showUndoToast(toClear.length);
        }, 260);
    }

    function showUndoToast(count) {
        if (toastTimer) window.clearTimeout(toastTimer);
        toastMessage.textContent = `${count} completed ${count === 1 ? 'task' : 'tasks'} cleared`;
        undoToast.classList.add('visible');
        undoToast.setAttribute('aria-hidden', 'false');
        toastTimer = window.setTimeout(hideUndoToast, 6000);
    }

    function hideUndoToast() {
        undoToast.classList.remove('visible');
        undoToast.setAttribute('aria-hidden', 'true');
        toastTimer = null;
    }

    function undoClear() {
        if (lastClearedTasks.length === 0) return;
        tasks = tasks.concat(lastClearedTasks);
        lastClearedTasks = [];
        saveTasks();
        render();
        hideUndoToast();
    }

    // ─── Desktop Close Choice ────────────────────────────────────────────

    window.showCloseDialog = function () {
        closeError.textContent = '';
        closeOverlay.classList.add('active');
        closeOverlay.setAttribute('aria-hidden', 'false');
        requestAnimationFrame(() => hideAppBtn.focus());
    };

    function hideCloseDialog() {
        closeOverlay.classList.remove('active');
        closeOverlay.setAttribute('aria-hidden', 'true');
    }

    async function handleDesktopClose(action) {
        if (!window.pywebview || !window.pywebview.api || !window.pywebview.api.handle_close_action) {
            closeError.textContent = 'Desktop controls are unavailable in this browser.';
            return;
        }

        hideAppBtn.disabled = true;
        quitAppBtn.disabled = true;
        closeError.textContent = '';

        try {
            hideCloseDialog();
            await window.pywebview.api.handle_close_action(action);
        } catch (error) {
            closeOverlay.classList.add('active');
            closeOverlay.setAttribute('aria-hidden', 'false');
            closeError.textContent = `Could not ${action === 'quit' ? 'end the program' : 'hide the app'}: ${error}`;
        } finally {
            hideAppBtn.disabled = false;
            quitAppBtn.disabled = false;
        }
    }

    // ─── Escape HTML ─────────────────────────────────────────────────────

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ─── Event Bindings ──────────────────────────────────────────────────

    addBtn.addEventListener('click', openAddModal);
    modalCancel.addEventListener('click', hideModal);
    modalSave.addEventListener('click', handleModalSave);
    finishedHeader.addEventListener('click', toggleFinished);
    clearCompletedBtn.addEventListener('click', showClearSheet);
    clearCancel.addEventListener('click', hideClearSheet);
    undoClearBtn.addEventListener('click', undoClear);
    hideAppBtn.addEventListener('click', () => handleDesktopClose('hide'));
    quitAppBtn.addEventListener('click', () => handleDesktopClose('quit'));
    clearOverlay.querySelectorAll('[data-clear-range]').forEach(option => {
        option.addEventListener('click', () => clearCompletedTasks(option.dataset.clearRange));
    });

    // Close modal on overlay click
    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) {
            hideModal();
        }
    });
    clearOverlay.addEventListener('click', (e) => {
        if (e.target === clearOverlay) hideClearSheet();
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if (closeOverlay.classList.contains('active')) {
                hideCloseDialog();
            } else if (clearOverlay.classList.contains('active')) {
                hideClearSheet();
            } else if (modalOverlay.classList.contains('active')) {
                hideModal();
            }
        }
        if (e.key === 'Enter' && modalOverlay.classList.contains('active')) {
            // Only if not focused on title input (allow multiline? no, single line)
            if (document.activeElement === projectTitleInput || document.activeElement === projectDeadlineInput) {
                handleModalSave();
            }
        }
    });

    // ─── Initialize ──────────────────────────────────────────────────────

    loadTasks();
    render();

})();

</script>
</body>
</html>
